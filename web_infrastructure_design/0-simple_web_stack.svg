<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="white"/>

  <!-- User -->
  <rect x="20" y="200" width="120" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="80" y="226" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#085041">User</text>
  <text x="80" y="246" text-anchor="middle" font-family="Arial" font-size="11" fill="#0F6E56">www.foobar.com</text>

  <!-- Arrow User to DNS -->
  <line x1="140" y1="230" x2="200" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="222" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">DNS query</text>

  <!-- DNS -->
  <rect x="200" y="200" width="120" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3C3489">DNS server</text>
  <text x="260" y="246" text-anchor="middle" font-family="Arial" font-size="11" fill="#534AB7">A record 8.8.8.8</text>

  <!-- Arrow DNS to Server -->
  <line x1="320" y1="230" x2="380" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="222" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">HTTP/HTTPS</text>

  <!-- Server container -->
  <rect x="380" y="40" width="400" height="420" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="580" y="72" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0C447C">Server (IP: 8.8.8.8)</text>

  <!-- Nginx -->
  <rect x="410" y="90" width="340" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="580" y="116" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#712B13">Nginx (web server)</text>
  <text x="580" y="136" text-anchor="middle" font-family="Arial" font-size="11" fill="#993C1D">handles HTTP requests</text>

  <!-- Arrow Nginx to App -->
  <line x1="580" y1="150" x2="580" y2="185" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App Server -->
  <rect x="410" y="185" width="340" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="580" y="211" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#633806">Application server</text>
  <text x="580" y="231" text-anchor="middle" font-family="Arial" font-size="11" fill="#854F0B">runs business logic</text>

  <!-- Arrow App to Code -->
  <line x1="580" y1="245" x2="580" y2="280" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Code Base -->
  <rect x="410" y="280" width="340" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="580" y="306" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#444441">Code base</text>
  <text x="580" y="326" text-anchor="middle" font-family="Arial" font-size="11" fill="#5F5E5A">application files</text>

  <!-- Arrow Code to MySQL -->
  <line x1="580" y1="340" x2="580" y2="375" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MySQL -->
  <rect x="410" y="375" width="340" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="580" y="401" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#27500A">MySQL (database)</text>
  <text x="580" y="421" text-anchor="middle" font-family="Arial" font-size="11" fill="#3B6D11">stores persistent data</text>

  <!-- Issues -->
  <text x="20" y="460" font-family="Arial" font-size="11" fill="#A32D2D">Issues: SPOF | Downtime on deploy | Cannot scale under high traffic</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
