<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="620" fill="white"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="20" y="270" width="110" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="75" y="296" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#085041">User</text>
  <text x="75" y="314" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F6E56">www.foobar.com</text>

  <!-- Arrow User to DNS -->
  <line x1="130" y1="300" x2="180" y2="300" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DNS -->
  <rect x="180" y="270" width="120" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="240" y="296" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#3C3489">DNS server</text>
  <text x="240" y="314" text-anchor="middle" font-family="Arial" font-size="10" fill="#534AB7">A record 8.8.8.8</text>

  <!-- Arrow DNS to HAProxy -->
  <line x1="300" y1="300" x2="360" y2="300" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HAProxy Load Balancer -->
  <rect x="360" y="260" width="150" height="80" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="2"/>
  <text x="435" y="291" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#72243E">HAProxy</text>
  <text x="435" y="308" text-anchor="middle" font-family="Arial" font-size="10" fill="#993556">Load balancer</text>
  <text x="435" y="324" text-anchor="middle" font-family="Arial" font-size="10" fill="#993556">Round Robin</text>

  <!-- Arrow HAProxy to Server 1 -->
  <line x1="510" y1="285" x2="570" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow HAProxy to Server 2 -->
  <line x1="510" y1="315" x2="570" y2="420" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server 1 container -->
  <rect x="570" y="40" width="300" height="260" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="720" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#0C447C">Server 1 (Primary)</text>

  <!-- Server 1: Nginx -->
  <rect x="590" y="80" width="260" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="720" y="98" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#712B13">Nginx</text>
  <text x="720" y="114" text-anchor="middle" font-family="Arial" font-size="10" fill="#993C1D">web server</text>

  <!-- Arrow -->
  <line x1="720" y1="124" x2="720" y2="138" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Server 1: App Server -->
  <rect x="590" y="138" width="260" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="720" y="156" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#633806">Application server</text>
  <text x="720" y="172" text-anchor="middle" font-family="Arial" font-size="10" fill="#854F0B">code base</text>

  <!-- Arrow -->
  <line x1="720" y1="182" x2="720" y2="196" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Server 1: MySQL Primary -->
  <rect x="590" y="196" width="260" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="720" y="214" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27500A">MySQL Primary</text>
  <text x="720" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#3B6D11">read and write</text>

  <!-- Server 2 container -->
  <rect x="570" y="340" width="300" height="260" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="720" y="366" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#0C447C">Server 2 (Replica)</text>

  <!-- Server 2: Nginx -->
  <rect x="590" y="380" width="260" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="720" y="398" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#712B13">Nginx</text>
  <text x="720" y="414" text-anchor="middle" font-family="Arial" font-size="10" fill="#993C1D">web server</text>

  <!-- Arrow -->
  <line x1="720" y1="424" x2="720" y2="438" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Server 2: App Server -->
  <rect x="590" y="438" width="260" height="44" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="720" y="456" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#633806">Application server</text>
  <text x="720" y="472" text-anchor="middle" font-family="Arial" font-size="10" fill="#854F0B">code base</text>

  <!-- Arrow -->
  <line x1="720" y1="482" x2="720" y2="496" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Server 2: MySQL Replica -->
  <rect x="590" y="496" width="260" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="720" y="514" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#27500A">MySQL Replica</text>
  <text x="720" y="530" text-anchor="middle" font-family="Arial" font-size="10" fill="#3B6D11">read only</text>

  <!-- Replication arrow between DBs -->
  <line x1="720" y1="240" x2="720" y2="496" stroke="#3B6D11" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="728" y="370" font-family="Arial" font-size="10" fill="#3B6D11">replication</text>

  <!-- Issues -->
  <text x="20" y="580" font-family="Arial" font-size="11" fill="#A32D2D">Issues: HAProxy = SPOF | No firewall | No HTTPS | No monitoring</text>
</svg>
